apiVersion: v1
kind: Secret
metadata:
  name: orderflow-secrets
  namespace: orderflow
type: Opaque
stringData:
  POSTGRES_USER: orderflow
  POSTGRES_PASSWORD: REPLACE_WITH_LOCAL_PASSWORD
  RABBITMQ_DEFAULT_USER: orderflow
  RABBITMQ_DEFAULT_PASS: REPLACE_WITH_LOCAL_PASSWORD
  DATABASE_URL: postgres://orderflow:REPLACE_WITH_LOCAL_PASSWORD@postgres:5432/orderflow?sslmode=disable
  RABBITMQ_URL: amqp://orderflow:REPLACE_WITH_LOCAL_PASSWORD@rabbitmq:5672/
