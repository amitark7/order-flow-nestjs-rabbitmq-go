apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: orderflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
        - name: notification-worker
          image: orderflow/notification-worker:health-v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orderflow-secrets
                  key: DATABASE_URL
            - name: KAFKA_BROKER
              value: "kafka:9092"
          ports:
            - name: health
              containerPort: 8081

          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2