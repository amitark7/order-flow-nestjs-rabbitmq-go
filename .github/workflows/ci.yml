
name: OrderFlow CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nestjs-api:
    name: NestJS API Tests and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: orderflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE: orderflow_test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USER: orderflow
      TEST_DB_PASSWORD: test_password

    defaults:
      run:
        working-directory: apps/order-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/order-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build API
        run: npm run build

  go-workers:
    name: Go Worker Tests and Builds
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        worker:
          - order-worker
          - outbox-publisher
          - notification-worker

    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: workers/${{ matrix.worker }}/go.mod
          cache: true
          cache-dependency-path: workers/${{ matrix.worker }}/go.sum

      - name: Run tests
        run: go test ./...

      - name: Build worker
        run: go build ./...
